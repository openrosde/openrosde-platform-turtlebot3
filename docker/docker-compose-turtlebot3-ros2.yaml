# version: "3.9"

################################################################################

# Robotis TurtleBot3 platform on ROS 2 overlay for OpenRoSDE.
# Passes TurtleBot3-specific environment variables to the container.

################################################################################

services:
  openrosde:
    environment:
      # No platform-specific environment variables for TurtleBot3 on ROS 2 at this time.
      - OPENROSDE_ROBOT_PLATFORM=${OPENROSDE_ROBOT_PLATFORM}
